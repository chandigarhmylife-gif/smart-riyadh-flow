name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Check Strategy Lab worker was bundled
        run: |
          ls dist/assets
          ls dist/assets | grep -q 'strategyLab.worker' || { echo "Strategy Lab worker bundle missing"; exit 1; }
